# Software Defecta - Apache overrides (included last, so these win)
ServerName defecta
ServerTokens Prod
ServerSignature Off

DocumentRoot /var/www/html
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Defense in depth: never serve the SQLite file over HTTP
<Directory /var/www/html/data>
    Require all denied
</Directory>

LoadModule rewrite_module modules/mod_rewrite.so

# Docker-friendly logs (go to stdout/stderr instead of files)
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
